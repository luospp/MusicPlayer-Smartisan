name: CI

on:
  push:
    branches: [master, dev, future]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 全量验证（构建 + lint）
        run: bash gradlew :app:assembleDebug :app:lintDebug --console=plain
