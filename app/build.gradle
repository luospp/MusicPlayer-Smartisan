apply plugin: 'com.android.application'
apply plugin: 'org.greenrobot.greendao'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
android {

    namespace 'com.yibao.music'

    compileSdk 34
    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 33
        versionCode 3
        versionName "2.0.0_20250715_sz"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a'
        }
        packagingOptions {
            doNotStrip "*/arm64-v8a/*.so"
        }

        greendao {
            schemaVersion 10
            daoPackage 'com.yibao.music.model.greendao'
            targetGenDir 'src/main/java/'
        }

        buildTypes {
            release {
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            }
        }
        buildFeatures {
            viewBinding true
        }
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }

        sourceSets {
            main {
                java {
                    srcDirs = ['src/main/java']
                }
                kotlin {
                    srcDirs = ['src/main/java']
                }
            }
        }

    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
        implementation 'androidx.core:core-ktx:1.13.1'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
        implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
        implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'


        implementation 'androidx.legacy:legacy-support-v4:1.0.0'
        implementation fileTree(include: ['*.jar'], dir: 'libs')
        androidTestImplementation('com.android.support.test.espresso:espresso-core:2.2.2', {
            exclude group: 'com.android.support', module: 'support-annotations'
        })
        implementation 'androidx.appcompat:appcompat:1.6.1'
        implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        testImplementation 'junit:junit:4.13.2'
        implementation 'com.belerweb:pinyin4j:2.5.0'
        implementation 'org.greenrobot:greendao:3.3.0'
        implementation 'com.google.code.gson:gson:2.8.9'
        implementation 'androidx.viewpager2:viewpager2:1.0.0'
        implementation 'com.google.android.material:material:1.10.0'
        implementation 'io.reactivex.rxjava2:rxjava:2.2.19'
        implementation 'com.squareup.okhttp3:okhttp:4.7.2'
        implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
        implementation 'com.github.bumptech.glide:glide:4.12.0'
        implementation 'com.squareup.retrofit2:retrofit:2.9.0'
        implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
        implementation 'com.squareup.retrofit2:adapter-rxjava2:2.7.1'
        annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
        implementation 'com.github.yuweiguocn:GreenDaoUpgradeHelper:v2.1.0'
        debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.8.1'

        // 百度统计
        implementation 'com.baidu.mobstat:mtj-sdk:4.0.7.6'
        // 65536
        // Ensure Java compiles before Kotlin in mixed projects
        kapt 'com.github.bumptech.glide:compiler:4.12.0'
        implementation 'com.android.support:multidex:1.0.3'

        implementation 'com.github.JessYanCoding:AndroidAutoSize:v1.2.1'


    }
    buildFeatures {
        aidl true
    }


}


